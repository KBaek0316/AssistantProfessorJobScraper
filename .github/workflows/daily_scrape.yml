name: Daily Academic Job Scraper

on:
  schedule:
    # Runs daily at 06:00 UTC (1:00 AM Central / 2:00 AM Eastern)
    - cron: '0 6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Needed to commit updated jobs.csv, jobs.xlsx, map.html

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Job Scraper & Summarizer
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.7-flash' }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          GOOGLE_SHEET_TAB_NAME: ${{ secrets.GOOGLE_SHEET_TAB_NAME }}
        run: |
          python job_scraper.py

      - name: Commit and push updated files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add jobs.csv jobs.xlsx map.html .cache/geocache.json .cache/filtered_jobs.json || true
          if git diff --staged --quiet; then
            echo "No changes detected in job listings today."
          else
            git commit -m "Auto-update job listings and interactive map [skip ci]"
            git push
          fi
